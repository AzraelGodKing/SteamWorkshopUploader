name: Promote test and release

# Run by hand (Actions > Promote test and release > Run workflow) when test is ready to ship. It:
#   1. rebases test onto main and runs the tests on the result,
#   2. fast-forwards main to it and tags main with the version from SteamWorkshopUploader.csproj, whose "## <version>" section
#      in CHANGELOG.md becomes the release notes (the tag starts release.yml, which builds and publishes),
#   3. resets test to the new main.
# Nothing is bumped here: it releases whatever version test already declares. main, the tag and test are pushed in one
# atomic push, so either all three move or none do.
#
# Needs a RELEASE_TOKEN secret: a fine-grained token for this repository with Contents and Workflows read/write. The
# built-in token cannot push commits that change workflow files, and a tag it pushes would not start release.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version you expect to release (optional; stops if test declares a different one)'
        required: false
        default: ''
      dry_run:
        description: 'Only check and test; push nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote-release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  promote:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Add a RELEASE_TOKEN secret (fine-grained token for this repository, Contents and Workflows read/write). See Releasing in the README."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rebase test onto main
        run: |
          main=$(git rev-parse origin/main)
          echo "MAIN_SHA=$main" >> "$GITHUB_ENV"
          if ! git rev-parse -q --verify origin/test > /dev/null; then
            echo "No test branch: releasing main as it is, and test will be created from it."
            echo "TEST_SHA=" >> "$GITHUB_ENV"
            exit 0
          fi
          test=$(git rev-parse origin/test)
          echo "TEST_SHA=$test" >> "$GITHUB_ENV"
          git checkout -q -B test origin/test
          if git merge-base --is-ancestor origin/main test; then
            echo "test is already on top of main: $(git rev-list --count origin/main..test) commit(s) to bring in, no rebase needed."
            exit 0
          fi
          # Rebased commits keep their authors; the committer is whoever committed the tip of test.
          git config user.name "$(git log -1 --format=%cn test)"
          git config user.email "$(git log -1 --format=%ce test)"
          if ! git rebase origin/main; then
            git rebase --abort
            echo "::error::test does not rebase cleanly onto main. Rebase it by hand, push it, and run this again."
            exit 1
          fi
          echo "Rebased $(git rev-list --count origin/main..test) commit(s) from test onto main."

      - name: Check version, tag and release notes
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SteamWorkshopUploader.csproj | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::No <Version> in SteamWorkshopUploader.csproj"
            exit 1
          fi
          expected="${EXPECTED#v}"
          if [ -n "$expected" ] && [ "$expected" != "$version" ]; then
            echo "::error::You asked for $expected, but SteamWorkshopUploader.csproj on test says $version"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null || git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version already exists. Bump <Version> and add a '## <version>' CHANGELOG.md section on test first."
            exit 1
          fi
          # Same section reader as release.yml, so a release that passes here passes there.
          awk -v v="$version" '
            { sub(/\r$/, "") }
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::SteamWorkshopUploader.csproj says $version, but CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          {
            echo "## Releasing $version"
            echo
            echo "Commits going to main:"
            echo
            git log --format='- %s (%an)' "$MAIN_SHA..HEAD"
            echo
            echo "### Release notes"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release

      - name: Push main, the tag and test
        if: ${{ !inputs.dry_run }}
        run: |
          tag="v$VERSION"
          git tag "$tag" HEAD
          # Plain push to main (fast-forward only); test is replaced, but only if nobody pushed to it during this run.
          git push --atomic --force-with-lease="refs/heads/test:$TEST_SHA" origin \
            "HEAD:refs/heads/main" \
            "refs/tags/$tag:refs/tags/$tag" \
            "HEAD:refs/heads/test"
          {
            echo
            echo "Pushed main and test at $(git rev-parse --short HEAD) and tagged it $tag."
            echo "The [Release workflow](https://github.com/$GITHUB_REPOSITORY/actions/workflows/release.yml) is now building $tag."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: nothing was pushed. Run again without it to release $VERSION." >> "$GITHUB_STEP_SUMMARY"
