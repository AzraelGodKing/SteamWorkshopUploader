name: CI

on:
  push:
    branches: [main, test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The upload tests drive a fake SteamCMD shell script and only run off Windows.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release

  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the screenshot comparison builds the base branch too

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build SteamCmdHelper.csproj -c Release

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Publish self-contained exe
        env:
          # Baked into the exe so the ? button can send layout requests (see RequestKey.targets).
          # Empty for pull requests from forks, which then build without a key.
          LINEAR_CREATE_API_KEY: ${{ secrets.LINEAR_CREATE_API_KEY }}
          LINEAR_TEAM_UUID: ${{ secrets.LINEAR_TEAM_UUID }}
          PROJECTID: ${{ secrets.PROJECTID }}
          LABELIDS: ${{ secrets.LABELIDS }}
          LABELMAP: ${{ secrets.LABELMAP }}
        run: dotnet publish SteamCmdHelper.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o publish

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: SteamCmdHelper-win-x64
          path: publish/SteamCmdHelper.exe

      # Screenshots of both themes for reviewing UI changes. Best effort: never fails the build.
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          # A 1920x1080 screen, so the wide-window shots (the details panel beside the mod list) fit.
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { "Could not change the screen size: $_" }
          New-Item -ItemType Directory -Force shots | Out-Null
          Start-Process -FilePath publish/SteamCmdHelper.exe -ArgumentList '--shot', "$PWD\shots" -Wait
          Get-ChildItem shots
          if (Test-Path shots/error.txt) { Get-Content shots/error.txt }

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

      # Pull requests only: build the base branch, take the same screenshots, and say which windows changed.
      - name: Screenshots of the base branch
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        env:
          LINEAR_CREATE_API_KEY: ${{ secrets.LINEAR_CREATE_API_KEY }}
          LINEAR_TEAM_UUID: ${{ secrets.LINEAR_TEAM_UUID }}
          PROJECTID: ${{ secrets.PROJECTID }}
          LABELIDS: ${{ secrets.LABELIDS }}
          LABELMAP: ${{ secrets.LABELMAP }}
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          dotnet build ../base/SteamCmdHelper.csproj -c Release -o basebin
          New-Item -ItemType Directory -Force baseshots | Out-Null
          Start-Process -FilePath basebin/SteamCmdHelper.exe -ArgumentList '--shot', "$PWD\baseshots" -Wait
          Get-ChildItem baseshots

      - name: Compare screenshots
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: powershell
        run: ./.github/scripts/compare-shots.ps1

      - name: Upload screenshot differences
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: shots-diff
          if-no-files-found: ignore
