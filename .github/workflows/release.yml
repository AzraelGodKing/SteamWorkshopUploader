name: Release

# Push a tag like v1.2.0 (or run "Promote test and release", which pushes one) to build and publish a GitHub Release.
# The tag must match <Version> in SteamWorkshopUploader.csproj and have a "## 1.2.0" section in CHANGELOG.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  actions: read # SignPath fetches the unsigned artifact

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    env:
      # Step conditions can only see job-level env, so the signing gate reads it here.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check version and read release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          csproj=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' SteamWorkshopUploader.csproj)
          if [ "$version" != "$csproj" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$csproj</Version> in SteamWorkshopUploader.csproj"
            exit 1
          fi
          # CHANGELOG.md wraps long items onto indented lines; GitHub shows every line break in release notes, so those
          # lines are joined back onto their item (a nested "- " item stays on its own line).
          awk -v v="$version" '
            { sub(/\r$/, "") }
            $0 == "## " v { on = 1; next }
            on && /^## / { exit }
            !on { next }
            held && /^[ \t]+[^ \t]/ && !/^[ \t]+[-*+][ \t]/ { sub(/^[ \t]+/, ""); buf = buf " " $0; next }
            { if (held) print buf; buf = $0; held = /[^ \t]/; if (!held) print }
            END { if (held) print buf }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi
          # SignPath Foundation asks for the code signing policy to be linked from every download page, so the link is
          # only added once signing is set up (the README needs its "Code signing policy" section back then).
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            printf '\n---\n[Code signing policy](https://github.com/%s#code-signing-policy)\n' "$GITHUB_REPOSITORY" >> notes.md
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/SteamCmdHelper.Tests -c Release

      - name: Publish
        env:
          # Baked into the exe so the ? button can send layout requests (see RequestKey.targets).
          LINEAR_CREATE_API_KEY: ${{ secrets.LINEAR_CREATE_API_KEY }}
          LINEAR_TEAM_UUID: ${{ secrets.LINEAR_TEAM_UUID }}
          PROJECTID: ${{ secrets.PROJECTID }}
          LABELIDS: ${{ secrets.LABELIDS }}
          LABELMAP: ${{ secrets.LABELMAP }}
        run: |
          # Self-contained single exe: runs without .NET installed. Not compressed: a compressed exe is under half the
          # size, but unpacks the whole .NET runtime into memory on every start, which made opening the app slow.
          # ReadyToRun compiles the app ahead of time so its windows are not compiled at start-up either.
          dotnet publish SteamWorkshopUploader.csproj -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o out/standalone
          # Framework-dependent folder: small, for machines with the .NET 8 Desktop Runtime
          # or where antivirus refuses large unsigned single-file exes.
          dotnet publish SteamWorkshopUploader.csproj -c Release -r win-x64 --no-self-contained -p:PublishReadyToRun=true -o out/portable
          # Self-contained folder for the Setup.exe (Velopack, see AppUpdates.cs). A folder rather than one file: Velopack's
          # Update.exe swaps whole folders, and updates between versions only download the files that changed.
          dotnet publish SteamWorkshopUploader.csproj -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o out/velopack

      # Code signing through SignPath (free for open source; see "Code signing (maintainer)" in the README). Until the
      # SIGNPATH_API_TOKEN secret exists these steps are skipped and the release is unsigned, as before. Signing
      # happens before the zip and the checksums are made, so both cover the signed files.
      - name: Upload unsigned files for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: |
            out/standalone/SteamWorkshopUploader.exe
            out/portable

      - name: Sign with SignPath
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SteamWorkshopUploader' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          # Checked against each file's product version (packaging/signpath/artifact-configuration.xml).
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          # Every release waits for a manual approval in SignPath; give it an hour instead of the default 10 minutes.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed files
        if: steps.unsigned.outcome == 'success'
        run: |
          cp -r signed/. out/
          ls -l out/standalone

      # Builds the Setup.exe and the update packages that installed copies download. The previous release's package is
      # fetched first so this one can include a delta (only what changed). Not signed yet: SignPath covers the files above.
      - name: Setup.exe and update packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" -o out/vpk \
            || echo "No earlier Velopack release to make a delta from."
          vpk pack --packId AzraelGodKing.SteamWorkshopUploader --packVersion "$VERSION" --packDir out/velopack \
            --mainExe SteamWorkshopUploader.exe --packTitle "Steam Workshop Uploader" --packAuthors AzraelGodKing --icon Assets/app.ico \
            --noPortable -o out/vpk
          ls -l out/vpk

      - name: Package
        run: |
          mkdir dist
          # Velopack finds its packages by these exact names, so only the Setup.exe is renamed.
          cp out/vpk/AzraelGodKing.SteamWorkshopUploader-win-Setup.exe "dist/SteamWorkshopUploader-$VERSION-Setup.exe"
          cp out/vpk/AzraelGodKing.SteamWorkshopUploader-"$VERSION"-*.nupkg out/vpk/releases.win.json out/vpk/assets.win.json out/vpk/RELEASES dist/
          cp out/standalone/SteamWorkshopUploader.exe "dist/SteamWorkshopUploader-$VERSION-win-x64.exe"
          (cd out/portable && 7z a -tzip "../../dist/SteamWorkshopUploader-$VERSION-win-x64-framework-dependent.zip" . > /dev/null)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "Steam Workshop Uploader $VERSION" --notes-file notes.md $prerelease

  # After a release: point the Scoop manifest in bucket/ at it (as a pull request), and send the new version to winget
  # once the package is in winget-pkgs and a WINGET_TOKEN secret is set. Neither can fail the release.
  package-managers:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Scoop manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $base = "https://github.com/${{ github.repository }}/releases/download/v$version"
          # The download is served as application/octet-stream, so Content is bytes, not text.
          $sums = [Text.Encoding]::UTF8.GetString((Invoke-WebRequest "$base/SHA256SUMS.txt").RawContentStream.ToArray())
          $exe = "SteamWorkshopUploader-$version-win-x64.exe"
          $hash = ($sums -split "`n" | Where-Object { $_ -match [regex]::Escape($exe) } | ForEach-Object { ($_ -split '\s+')[0] } | Select-Object -First 1)
          if (-not $hash) { throw "SHA256SUMS.txt has no line for $exe" }
          $file = 'bucket/steamworkshopuploader.json'
          $m = Get-Content $file -Raw | ConvertFrom-Json
          $m.version = $version
          $m.architecture.'64bit'.url = "$base/$exe#/SteamWorkshopUploader.exe"
          $m.architecture.'64bit'.hash = $hash.ToLower()
          ($m | ConvertTo-Json -Depth 10) + "`n" | Set-Content $file -NoNewline -Encoding utf8NoBOM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $branch = "scoop/v$version"
          git checkout -b $branch
          git commit -am "Point the Scoop manifest at $version"
          git push origin $branch
          gh pr create --base main --head $branch --title "Point the Scoop manifest at $version" --body "Updates bucket/steamworkshopuploader.json to the $version release (URL and SHA-256 from its SHA256SUMS.txt)."

      - name: winget
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Output "No WINGET_TOKEN secret: winget is not updated (see Install with winget or Scoop in the README)."; exit 0 }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/SteamWorkshopUploader-$version-win-x64.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update AzraelGodKing.SteamWorkshopUploader --version $version --urls $url --submit --token $env:WINGET_TOKEN
